[package]
name = "rkotlin"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Run Gradle (Kotlin, Android, JVM) builds and tests on remote sandboxes (instabox, Daytona, any SSH host) from your terminal, editor or AI agent"
license = "MIT"
repository = "https://github.com/igun997/rkotlin"
readme = "README.md"
keywords = ["kotlin", "gradle", "android", "remote", "mcp"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
