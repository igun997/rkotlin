<!doctype html>
<!-- Source of assets/banner.png (1280x640, also the GitHub social preview). Regenerate with:
     google-chrome --headless --hide-scrollbars --window-size=1280,640 --screenshot=assets/banner.png assets/banner/banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; background: #140F2B; overflow: hidden; }
  body { font-family: "Inter", "Segoe UI", "DejaVu Sans", sans-serif; color: #F4EEFF; position: relative; }
  .glow { position: absolute; right: -120px; top: -140px; width: 900px; height: 900px; border-radius: 50%;
          background: radial-gradient(circle, rgba(127,82,255,.30) 0%, rgba(199,17,225,.10) 45%, rgba(20,15,43,0) 70%); }
  .mascot { position: absolute; right: 40px; top: 30px; width: 580px; height: 580px; border-radius: 48px; }
  .left { position: absolute; left: 76px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .by { font-size: 22px; font-weight: 500; color: #B9A8F5; letter-spacing: .02em; margin-bottom: 14px; }
  .by b { color: #F4EEFF; font-weight: 700; }
  h1 { font-size: 132px; line-height: 1; font-weight: 800; letter-spacing: -.04em;
       background: linear-gradient(90deg, #7F52FF 0%, #C711E1 55%, #FF8A2B 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin-top: 22px; font-size: 38px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .sub { margin-top: 16px; font-size: 23px; line-height: 1.45; color: #CFC4FF; font-weight: 400; max-width: 560px; }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip { padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(207,196,255,.28);
          font-size: 20px; font-weight: 600; color: #F4EEFF; }
  .foot { position: absolute; left: 76px; right: 76px; bottom: 34px; display: flex; justify-content: space-between; align-items: center;
          font-size: 19px; color: #B9A8F5; }
  .foot .sib b { color: #F4EEFF; font-weight: 600; }
  .built { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 12px; background: rgba(255,176,32,.12);
           border: 1px solid rgba(255,176,32,.45); color: #FFD27A; font-weight: 600; }
  .built svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="mascot" src="mascot-frame.png" alt="">
  <div class="left">
    <div class="by">by <b>igun997</b></div>
    <h1>rkotlin</h1>
    <div class="tag">Build Kotlin on someone else's computer.</div>
    <div class="sub">Gradle, Android and JVM builds on a remote box. Your laptop stays cool, your phone gets the app.</div>
    <div class="chips"><span class="chip">instabox</span><span class="chip">Daytona</span><span class="chip">your VPS</span></div>
  </div>
  <div class="foot">
    <div class="sib">Sibling of <b>rcargo</b> &middot; <b>rflutter</b></div>
    <div class="built">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Built with rcargo
    </div>
  </div>
</body>
</html>
